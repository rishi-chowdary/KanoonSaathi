{% extends "base.html" %}

{% block title %}500 Internal Server Error — KanoonSaathi{% endblock %}

{% block content %}
<div class="auth-container" style="text-align: center; margin-top: 4rem;">
  <div class="card">
    <h1 style="font-size: 3.5rem; margin-bottom: 0.5rem; color: var(--color-danger);">500</h1>
    <h2 style="font-size: 1.4rem; margin-bottom: 1rem;">Internal Server Error</h2>
    <p class="error-message">
      Something failed on the server while handling this request. Reload the page or try again in a moment.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return Home</a>
  </div>
</div>
{% endblock %}
