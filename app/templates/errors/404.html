{% extends "base.html" %}

{% block title %}404 Not Found — LexiLegal AI{% endblock %}

{% block content %}
<div class="auth-container" style="text-align: center; margin-top: 4rem;">
  <div class="card">
    <h1 style="font-size: 3.5rem; margin-bottom: 0.5rem; color: var(--color-primary);">404</h1>
    <h2 style="font-size: 1.4rem; margin-bottom: 1rem;">Page Not Found</h2>
    <p class="error-message">
      This document or page was not found. It may have been deleted or belong to another account.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return Home</a>
  </div>
</div>
{% endblock %}
