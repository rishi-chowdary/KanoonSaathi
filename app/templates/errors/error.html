{% extends "base.html" %}

{% block title %}{{ code }} {{ title }} — LexiLegal AI{% endblock %}

{% block content %}
<div class="auth-container" style="text-align: center; margin-top: 4rem;">
  <div class="card">
    <h1 style="font-size: 3.5rem; margin-bottom: 0.5rem; color: var(--color-warning);">{{ code }}</h1>
    <h2 style="font-size: 1.4rem; margin-bottom: 1rem;">{{ title }}</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
      {{ message }}
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return Home</a>
  </div>
</div>
{% endblock %}
