# SBERT prototypes for zero-shot semantic matching
# Each category has 1-3 prototype sentences capturing its core legal semantics.

categories:
  Confidentiality:
    - "Receiving Party shall hold and maintain all proprietary and confidential information in strictest secrecy and not disclose it to third parties."
    - "The parties agree to protect proprietary technical and business disclosures against unauthorized use or dissemination."
  Termination:
    - "Either party may terminate this agreement immediately upon material breach or without cause upon prior written notice."
    - "Provisions governing contract termination, default cure periods, cancellation rights, and post-termination survival."
  Intellectual Property:
    - "Employee or contractor assigns all right, title, and interest in all inventions, patents, copyrights, and works created to the company."
    - "All intellectual property rights, trademarks, trade secrets, and proprietary materials shall remain the sole property of the creator."
  Liability and Indemnification:
    - "Party shall indemnify, defend, and hold harmless the other party against all third-party claims, liabilities, damages, and costs."
    - "Limitation of liability disclaiming indirect, consequential, or punitive damages, subject to an aggregate monetary cap."
  Dispute Resolution:
    - "Any dispute, controversy, or claim arising out of this contract shall be submitted to binding arbitration or mediation."
    - "Procedures for settling disputes through good-faith negotiation, escalation, or judicial resolution."
  Governing Law:
    - "This agreement shall be governed by, interpreted, and construed in accordance with the substantive laws and courts of the specified state."
    - "The parties submit to the exclusive jurisdiction and venue of the courts located in the designated state or federal district."
  Payment Terms:
    - "Client or tenant agrees to pay all fees, base salary, monthly rent, deposits, invoicing milestones, and late payment interest."
    - "Payment schedule, invoicing procedures, security deposits, compensation, and compounding interest on delinquent amounts."
  Representations and Warranties:
    - "Each party represents and warrants that it has full legal power, corporate authority, and capacity to enter into and perform this agreement."
    - "Seller warrants that the deliverables shall conform to specifications and be free of defects in materials or workmanship."
  Non-Compete and Non-Solicitation:
    - "Employee or partner covenants not to compete, solicit clients, or recruit employees for a period following separation."
    - "Restrictive covenant barring direct or indirect commercial competition and client solicitation within a geographical area."
  Force Majeure:
    - "Neither party shall be held liable for delays or non-performance caused by acts of God, war, pandemic, fire, or government orders."
    - "Unforeseeable external circumstances beyond reasonable control excusing performance obligations."
  Assignment:
    - "Neither party may assign, transfer, or delegate its rights or obligations under this agreement without prior written consent."
    - "Restrictions on assigning the contract or subletting the premises without explicit authorization."
  Severability:
    - "If any term or provision of this agreement is held invalid or unenforceable, the remaining terms shall remain in full force."
    - "Unenforceability of any single clause will not impair or invalidate the enforceability of other provisions."
  Amendment:
    - "No alteration, amendment, modification, or waiver of this agreement shall be binding unless executed in writing by both parties."
    - "Requirement of mutual written consent to amend or modify the contractual terms."
  Notices:
    - "All formal notices, demands, and communications must be in writing and delivered by certified mail, courier, or email."
    - "Designation of official addresses, contact details, and delivery methods for legal notices."
  Term and Renewal:
    - "This agreement shall commence on the effective date and continue for a term of months or years, with provisions for renewal."
    - "Duration of the agreement, expiration date, and automatic renewal unless written notice of cancellation is provided."
  Data Protection and Privacy:
    - "The parties shall maintain adequate data security, confidentiality safeguards, and comply with privacy regulations."
    - "Obligations regarding processing, storage, protection, and non-disclosure of personal data and privacy compliance."
  Insurance:
    - "Party shall maintain commercial general liability, professional indemnity, and workers compensation insurance."
    - "Requirements for insurance policies, minimum coverage limits, and naming the other party as additional insured."
  Criminal Offence and Punishment:
    - "Whoever commits an offence under the Bharatiya Nyaya Sanhita or Indian Penal Code shall be punished with imprisonment, fine, or community service."
    - "Criminal offence definition specifying mens rea, dishonest inducement, theft, hurt, homicide, or intimidation and prescribed jail sentence."
  Constitutional Right and Provision:
    - "Fundamental right under the Constitution of India guaranteeing equality before law, freedom of speech, life, personal liberty, or writ remedies."
    - "Constitutional article limiting State power, specifying reasonable restrictions, or granting Supreme Court and High Court writ jurisdiction."
  Statutory Definition and Exception:
    - "Statutory explanation, proviso, illustration, or carve-out defining terms and exceptions under an Act of Parliament."
  Jurisdiction and Procedure:
    - "Criminal or constitutional procedure governing arrest, production before a magistrate, bail, cognizable status, or High Court jurisdiction."
  Other:
    - "General miscellaneous contract provisions, preamble, definitions, recitals, or operational descriptions."

document_types:
  "Bharatiya Nyaya Sanhita (BNS) Statute":
    - "Bharatiya Nyaya Sanhita, 2023 statutory sections defining criminal offences, punishments, imprisonment terms, fines, and community service in India."
  "Indian Penal Code (IPC) Statute":
    - "Indian Penal Code, 1860 statutory sections defining criminal offences, penalties, culpable homicide, theft, cheating, and criminal breach of trust."
  "Constitution of India":
    - "Articles of the Constitution of India covering Fundamental Rights, equality before law, freedom of speech, life and personal liberty, and constitutional remedies."
  "Non-Disclosure Agreement (NDA)":
    - "Non-disclosure and confidentiality agreement protecting confidential proprietary information between disclosing and receiving party."
  "Residential Lease Agreement":
    - "Residential lease or rental agreement where landlord leases premises to tenant for monthly rent and security deposit."
  "Executive Employment Agreement":
    - "Executive employment agreement between company and employee governing executive position, compensation, duties, and severance."
  "Master Services Agreement":
    - "Master services agreement or vendor contract for professional services, statements of work, and enterprise consulting."
  "Promissory Note":
    - "Promissory note or loan agreement where borrower promises to pay principal amount plus interest to lender on schedule."
  "Property Deed":
    - "Quitclaim deed or warranty deed conveying real estate property from grantor to grantee."
  "Commercial Agreement":
    - "General commercial contract or business partnership agreement defining mutual obligations."

