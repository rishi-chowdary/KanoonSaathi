    category: "Latin"
  mutatis mutandis:
    plain_replacement: "with necessary changes made"
    definition: "Applying the same rules to a different situation with appropriate minor alterations."
    category: "Latin"
  in perpetuity:
    plain_replacement: "forever without end"
    definition: "Lasting indefinitely into the future with no expiration date."
    category: "Contractual"
  covenant:
    plain_replacement: "formal legal promise"
    definition: "A binding contractual agreement to do or refrain from doing something specific."
    category: "Contractual"
  warranty:
    plain_replacement: "formal promise or guarantee"
    definition: "A legally enforceable promise that a fact, product, or condition is as represented."
    category: "Contractual"
  representation:
    plain_replacement: "factual statement"
    definition: "A statement of past or present fact made to induce someone into a contract."
