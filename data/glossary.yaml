    category: "Archaic"
  hereof:
    plain_replacement: "of this agreement"
    definition: "Concerning or belonging to this document."
    category: "Archaic"
  hereto:
    plain_replacement: "to this agreement"
    definition: "Attached or related to this document."
    category: "Archaic"
  hereunder:
    plain_replacement: "under this agreement"
    definition: "Governed by the provisions of this contract."
    category: "Archaic"
  wherefore:
    plain_replacement: "for that reason"
