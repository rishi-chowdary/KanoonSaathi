# KanoonSaathi — 150+ Legal Term Glossary
# Each term contains:
# - definition: Clear 1-2 sentence plain-English explanation for non-lawyers
# - plain_replacement: Direct plain-English substitution used in simple English rewriting
# - category: Domain category (Liability, Procedure, Contractual, Latin, IP, etc.)

terms:
  indemnify:
    plain_replacement: "compensate for loss and protect from legal claims"
    definition: "To agree to pay for someone else's legal fees, damages, or losses if they get sued."
    category: "Liability"
  indemnification:
    plain_replacement: "financial compensation for legal losses"
    definition: "A promise where one party reimburses the other for legal damages or third-party claims."
    category: "Liability"
  hold harmless:
    plain_replacement: "not hold responsible for any harm or damages"
    definition: "An agreement not to blame or sue the other party if problems or losses occur."
    category: "Liability"
  severability:
    plain_replacement: "independent validity of remaining parts"
    definition: "If a court finds one clause invalid, the rest of the contract still remains legally active."
    category: "Contractual"
  force majeure:
    plain_replacement: "unforeseeable emergencies (acts of God)"
    definition: "Uncontrollable events like natural disasters, war, or pandemics that excuse non-performance."
    category: "Contractual"
  liquidated damages:
    plain_replacement: "pre-agreed penalty amount"
    definition: "A predetermined amount of money parties agree to pay in advance if a specific breach happens."
    category: "Liability"
  cure period:
    plain_replacement: "grace period to fix the issue"
    definition: "The amount of time a party has to correct a contract violation before penalties apply."
    category: "Procedure"
  subrogation:
    plain_replacement: "taking over another's right to sue"
