# Expected standard provisions per document type for missing clause detection and classification.

expected_provisions:
  "Non-Disclosure Agreement (NDA)":
    - title: "Definition of Confidential Information"
      category: "Confidentiality"
      why_it_matters: "Clarifies what information is protected and what is excluded."
      risk_level: "HIGH"
    - title: "Term and Duration of Confidentiality"
      category: "Term and Renewal"
      why_it_matters: "Prevents perpetual exposure or uncertain expiration of trade secret duties."
      risk_level: "MEDIUM"
    - title: "Permitted Use and Standard of Care"
      category: "Confidentiality"
      why_it_matters: "Defines permissible internal uses and handling requirements."
      risk_level: "MEDIUM"
    - title: "Return or Destruction of Materials"
      category: "Termination"
      why_it_matters: "Ensures tangible confidential files are eliminated upon termination."
      risk_level: "MEDIUM"
    - title: "Remedies and Injunctions"
      category: "Dispute Resolution"
      why_it_matters: "Permits equitable injunctive relief without proving monetary harm."
      risk_level: "LOW"

  "Residential Lease Agreement":
    - title: "Rent and Payment Due Dates"
      category: "Payment Terms"
      why_it_matters: "Sets fixed payment amounts, due dates, and grace periods."
      risk_level: "HIGH"
    - title: "Security Deposit Return Terms"
      category: "Payment Terms"
      why_it_matters: "Specifies allowable deductions and timeline for deposit refund."
      risk_level: "HIGH"
    - title: "Landlord Right of Entry Notice"
      category: "Other"
      why_it_matters: "Protects tenant privacy by requiring 24-48 hours advance notice before inspection."
      risk_level: "MEDIUM"
    - title: "Maintenance Responsibilities"
      category: "Other"
      why_it_matters: "Delineates repair obligations between landlord and tenant."
      risk_level: "MEDIUM"
    - title: "Termination and Eviction Procedures"
      category: "Termination"
      why_it_matters: "Defines default notice periods and cure windows before eviction."
      risk_level: "HIGH"

  "Executive Employment Agreement":
    - title: "Base Salary and Benefits"
      category: "Payment Terms"
      why_it_matters: "Guarantees executive compensation, bonuses, and health coverage."
      risk_level: "HIGH"
    - title: "Severance and Separation Pay"
      category: "Payment Terms"
      why_it_matters: "Protects executive compensation upon involuntary termination without cause."
      risk_level: "HIGH"
    - title: "Termination for Cause vs. Without Cause"
      category: "Termination"
      why_it_matters: "Defines exact grounds for immediate termination vs notice requirements."
      risk_level: "HIGH"
    - title: "Confidentiality and IP Ownership"
      category: "Intellectual Property"
      why_it_matters: "Assigns work product while setting boundaries on inventions."
      risk_level: "HIGH"
    - title: "Scope of Restrictive Covenants"
      category: "Non-Compete and Non-Solicitation"
      why_it_matters: "Restricts post-employment competition within reasonable time and geography."
      risk_level: "HIGH"

  "Master Services Agreement":
    - title: "Scope of Work and Deliverables"
      category: "Other"
      why_it_matters: "Prevents scope creep and aligns client expectations."
      risk_level: "HIGH"
    - title: "Fees and Payment Deadlines"
      category: "Payment Terms"
      why_it_matters: "Establishes payment milestones, invoice terms, and dispute mechanisms."
      risk_level: "HIGH"
    - title: "Mutual Indemnification"
      category: "Liability and Indemnification"
      why_it_matters: "Balances third-party liability exposure fairly between both parties."
      risk_level: "HIGH"
    - title: "Limitation of Liability Cap"
      category: "Liability and Indemnification"
      why_it_matters: "Caps exposure to fees paid, protecting against catastrophic liability."
      risk_level: "HIGH"
    - title: "Termination for Convenience and Cause"
      category: "Termination"
      why_it_matters: "Allows exit without penalty on written notice."
      risk_level: "MEDIUM"

  "Promissory Note":
    - title: "Principal and Interest Rate"
      category: "Payment Terms"
      why_it_matters: "Specifies exact borrowed amount, interest rate, and calculation method."
      risk_level: "HIGH"
    - title: "Repayment Schedule"
      category: "Payment Terms"
      why_it_matters: "Sets installment dates and final maturity date."
      risk_level: "HIGH"
    - title: "Prepayment Terms"
      category: "Payment Terms"
      why_it_matters: "Clarifies whether early payoff incurs penalties."
      risk_level: "MEDIUM"
    - title: "Default and Acceleration"
      category: "Termination"
      why_it_matters: "Details lender remedies upon missed payments."
      risk_level: "HIGH"

