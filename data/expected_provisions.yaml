# LexiLegal AI — Expected Provisions Checklist by Document Type
# Used to detect missing clauses with strict "Possible omission" labeling.

document_types:
  NON_DISCLOSURE_AGREEMENT:
    name: "Non-Disclosure Agreement"
    expected_provisions:
      - provision_id: "nda_exclusions"
        clause_name: "Specific Exclusions from Confidential Information (Carve-outs)"
        category: "Confidentiality"
        risk_level: "HIGH"
        why_it_matters: "Without explicit exclusions (public domain, prior knowledge, independent development), you could be held liable for sharing information that is already common industry knowledge."
        typical_provision: "Standard NDAs explicitly exclude information that is or becomes publicly known, was already in the recipient's possession, or was independently developed."
        prototype_phrases:
          - "Confidential Information does not include information publicly known or already in possession of recipient."
          - "Exceptions to confidential information include public domain and independent development carve-outs."
          - "Exclusions from confidentiality: information lawfully received from third parties without restriction."

      - provision_id: "nda_compelled_disclosure"
        clause_name: "Compulsory Legal Process / Subpoena Carve-Out"
        category: "Confidentiality"
        risk_level: "HIGH"
        why_it_matters: "If served with a court subpoena or regulatory demand, failing to include this carve-out puts you in an impossible dilemma between contempt of court and contract breach."
        typical_provision: "Allows disclosure compelled by valid court order or statutory requirement, provided prompt written notice is given to the disclosing party."
        prototype_phrases:
          - "Recipient may disclose confidential information pursuant to a valid court order or subpoena with prompt notice."
          - "Permitted disclosures under legal compulsion, judicial order, or regulatory inquiry."
          - "Court compelled disclosure exception with prompt notice to disclosee."

      - provision_id: "nda_return_destruction"
        clause_name: "Return or Destruction of Disclosed Materials"
        category: "Confidentiality"
        risk_level: "MEDIUM"
        why_it_matters: "Clarifies obligations regarding copies, backups, and physical documents upon contract conclusion or request."
        typical_provision: "Upon termination or written request, recipient must promptly return or certify destruction of all confidential materials and copies."
        prototype_phrases:
          - "Upon request or termination, recipient shall return or destroy all confidential materials and certify in writing."
          - "Return or certified destruction of proprietary documents and copies upon conclusion."

      - provision_id: "nda_no_license"
        clause_name: "No License or IP Transfer Disclaimer"
        category: "Intellectual Property"
        risk_level: "LOW"
        why_it_matters: "Confirms that sharing trade secrets under NDA does not implicitly grant patent, trademark, or copyright licenses."
        typical_provision: "Neither party grants any patent, copyright, or trademark license under this agreement by disclosing confidential information."
        prototype_phrases:
          - "Nothing in this Agreement grants any license, title, or patent right in confidential information."
          - "No intellectual property license is granted or implied by the disclosure of information."

      - provision_id: "nda_remedies"
        clause_name: "Injunctive Relief and Remedies for Breach"
        category: "Remedies"
        risk_level: "MEDIUM"
        why_it_matters: "A monetary award is often inadequate once trade secrets are leaked; immediate court injunctive relief is critical to prevent dissemination."
        typical_provision: "Breach may cause irreparable harm entitling the disclosing party to seek immediate injunctive relief without posting bond."
        prototype_phrases:
          - "Disclosing party is entitled to seek equitable relief, including injunction, to prevent unauthorized disclosure."
          - "Monetary damages may be inadequate, granting rights to immediate injunctive relief."

  LEASE_AGREEMENT:
    name: "Commercial Lease / Rental Agreement"
    expected_provisions:
      - provision_id: "lease_security_deposit"
        clause_name: "Security Deposit Handling and Return Timeline"
        category: "Financial"
        risk_level: "HIGH"
        why_it_matters: "Omitting explicit deposit return timeframes and itemized deduction rules invites disputes and arbitrary withholding at lease end."
        typical_provision: "Landlord must hold security deposit in an escrow account and return the balance with an itemized deduction statement within 14 to 30 days."
        prototype_phrases:
          - "Security deposit shall be returned within thirty days following lease termination with itemized deductions."
          - "Landlord must refund security deposit balance within 21 days after tenant vacates premises."

      - provision_id: "lease_entry_notice"
        clause_name: "Right of Entry and Advance Notice"
        category: "Property Access"
        risk_level: "MEDIUM"
        why_it_matters: "Protects tenant privacy by requiring landlord to give reasonable advance written notice before entering rented premises except for emergencies."
        typical_provision: "Landlord may enter the premises for inspections or repairs only with at least 24 hours advance notice during normal business hours."
        prototype_phrases:
          - "Landlord may enter premises only upon providing at least 24 hours advance written notice."
          - "Right of inspection permitted with 48 hours notice during normal working hours."

      - provision_id: "lease_maintenance"
        clause_name: "Maintenance, Repairs, and Habitability Obligations"
        category: "Operational"
        risk_level: "MEDIUM"
        why_it_matters: "Clearly delineates whether the landlord or tenant is financially responsible for structural repairs, HVAC systems, plumbing, and roof maintenance."
        typical_provision: "Landlord maintains building structure, roof, and central systems; tenant maintains interior fixtures and routine cleanliness."
        prototype_phrases:
          - "Landlord shall maintain the structural elements, exterior walls, and common utilities."
          - "Repair responsibilities: landlord maintains HVAC, plumbing, and structural integrity."

      - provision_id: "lease_cure_period"
        clause_name: "Default Notice and Cure Period"
        category: "Procedure"
        risk_level: "HIGH"
        why_it_matters: "Without a written cure notice period, a tenant could be evicted precipitously for a technical violation or administrative payment error."
        typical_provision: "Landlord must give written notice specifying alleged default and grant tenant at least 10 to 30 days to cure before eviction."
        prototype_phrases:
          - "Tenant shall have thirty days following written notice to cure any non-monetary default."
          - "Notice of default with reasonable opportunity to cure prior to lease termination."

  EMPLOYMENT_AGREEMENT:
    name: "Employment Agreement"
    expected_provisions:
      - provision_id: "emp_benefits_pto"
        clause_name: "Benefits, Health Coverage, and Paid Time Off (PTO)"
        category: "Compensation"
        risk_level: "MEDIUM"
        why_it_matters: "Omitting standard vacation, sick leave, health insurance, and retirement benefit terms leaves employee benefits at company whim."
        typical_provision: "Employee is entitled to standard medical insurance, retirement contributions, and 15 to 20 days paid time off annually."
        prototype_phrases:
          - "Employee shall participate in company medical, health, and retirement benefit plans with paid time off."
          - "Paid vacation days, sick leave, and standard health insurance coverage."

      - provision_id: "emp_severance_termination"
        clause_name: "Termination for Cause and Severance Terms"
        category: "Termination"
        risk_level: "HIGH"
        why_it_matters: "Protects employee against abrupt termination without cause and defines clear standards for misconduct vs. severance eligibility."
        typical_provision: "Defines 'Cause' narrowly (felony, gross fraud); grants severance pay upon termination without cause."
        prototype_phrases:
          - "Termination without Cause entitles employee to severance compensation and accrued benefits."
          - "Definition of Cause for termination and severance payment schedule."

      - provision_id: "emp_ip_carveouts"
        clause_name: "Pre-Existing Inventions and Side-Project Carve-Outs"
        category: "Intellectual Property"
        risk_level: "MEDIUM"
        why_it_matters: "Without an explicit pre-existing inventions exhibit or personal time carve-out, the company may claim ownership of your independent work."
        typical_provision: "Inventions developed entirely on personal time without using company equipment or proprietary data remain employee property."
        prototype_phrases:
          - "Inventions developed on employee personal time without employer resources are excluded from assignment."
          - "Schedule of prior inventions and personal open-source projects excluded from company assignment."

  SERVICE_AGREEMENT:
    name: "Service Agreement / SaaS Terms"
    expected_provisions:
      - provision_id: "service_sow_acceptance"
        clause_name: "Detailed Scope of Work (SOW) and Acceptance Criteria"
        category: "Operational"
        risk_level: "HIGH"
        why_it_matters: "Vague deliverables without formal testing and acceptance procedures result in endless scope disputes and withheld payments."
        typical_provision: "Services shall conform to the attached Statement of Work; client has 10 business days to inspect and notify defects."
        prototype_phrases:
          - "Services shall be delivered pursuant to the Statement of Work with formal acceptance testing criteria."
          - "Client acceptance procedure: written approval within ten business days of delivery."

      - provision_id: "service_ip_ownership"
        clause_name: "Intellectual Property Ownership and Client Deliverable Assignment"
        category: "Intellectual Property"
        risk_level: "HIGH"
        why_it_matters: "Ensures the paying client actually owns the custom deliverables and software code produced specifically for them."
        typical_provision: "Client owns all custom deliverables upon full payment; vendor retains pre-existing tools and background IP."
        prototype_phrases:
          - "Upon payment in full, client owns all right, title, and interest in custom deliverables."
          - "Assignment of intellectual property in customized work product to customer."

      - provision_id: "service_sla_uptime"
        clause_name: "Service Level Agreement (SLA) and Uptime Commitment"
        category: "Operational"
        risk_level: "MEDIUM"
        why_it_matters: "Without an uptime guarantee and service credit remedy, clients have no recourse if cloud software suffers frequent outages."
        typical_provision: "Vendor commits to 99.9% service availability, excluding scheduled maintenance, with service fee credits for downtime."
        prototype_phrases:
          - "Vendor guarantees 99.9% monthly uptime availability with service credits for unscheduled downtime."
          - "Service level agreement establishing performance metrics, support response times, and outage remedies."

      - provision_id: "service_force_majeure"
        clause_name: "Force Majeure and Uncontrollable Delays"
        category: "Contractual"
        risk_level: "LOW"
        why_it_matters: "Excuses performance delays caused by natural disasters, telecommunications outages, or government orders."
        typical_provision: "Neither party is liable for performance delays caused by events beyond reasonable control."
        prototype_phrases:
          - "Neither party shall be liable for delays caused by acts of God, flood, or events beyond control."
          - "Force majeure excusing performance failures during uncontrollable natural disasters."

  PROMISSORY_NOTE:
    name: "Promissory Note / Loan Agreement"
    expected_provisions:
      - provision_id: "note_prepayment"
        clause_name: "Prepayment Rights and Penalty Terms"
        category: "Financial"
        risk_level: "MEDIUM"
        why_it_matters: "Borrowers need certainty on whether they can pay down the loan early without facing punitive prepayment penalty fees."
        typical_provision: "Borrower may prepay the principal balance in whole or in part at any time without penalty or premium."
        prototype_phrases:
          - "Borrower has the right to prepay the note in whole or in part without penalty."
          - "Prepayment permitted at any time without prepayment fees or interest premiums."

      - provision_id: "note_grace_period"
        clause_name: "Payment Grace Period and Notice Before Acceleration"
        category: "Procedure"
        risk_level: "HIGH"
        why_it_matters: "A borrower should receive written notice and at least a 10-day grace period before loan balance acceleration is declared."
        typical_provision: "Lender must provide written notice of delinquent payment and grant 10 to 15 days grace period before default."
        prototype_phrases:
          - "Lender shall give written notice of non-payment and a ten-day grace period prior to declaring default."
          - "Grace period of fifteen days before late fees or acceleration take effect."
