server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lexilegal-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lexilegal}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${MAX_FILE_SIZE_MB:10}MB

app:
  jwt:
    secret: ${JWT_SECRET:lexilegal_dev_secret_key_needs_to_be_at_least_256_bits_long_for_hmac_sha256}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  ai-engine:
    url: ${AI_ENGINE_URL:http://localhost:8000}
    internal-key: ${INTERNAL_API_KEY:lexilegal_internal_service_key_secret_2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

