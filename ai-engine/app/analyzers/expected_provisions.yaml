employment:
  - title: "Compensation and Payment Schedule"
    category: "Financial"
    why_it_matters: "Specifies base salary, wage rates, overtime eligibility, and exact payment cycles (e.g., bi-weekly, monthly)."
    potential_risk: "Lack of wage details can lead to wage disputes, unpaid labor claims, and compliance violations under labor regulations."
    typical_provision: "Employer shall pay Employee a base salary of [Amount], payable in accordance with Employer's standard payroll schedule."
    risk_level: "HIGH"

  - title: "Termination Notice and Severance Terms"
    category: "Contractual"
    why_it_matters: "Defines whether employment is at-will, what notice period is required for resignation or termination, and severance eligibility."
    potential_risk: "Without clear termination guidelines, an employee may face abrupt discharge without severance or transition pay."
    typical_provision: "Either party may terminate employment upon 30 days written notice, or immediately for Cause as defined herein."
    risk_level: "HIGH"

  - title: "Duties, Title, and Reporting Hierarchy"
    category: "Employment"
    why_it_matters: "Clarifies core job responsibilities, managerial hierarchy, and performance expectations."
    potential_risk: "Vague job descriptions allow employers to impose arbitrary workload expansion or unilateral demotion."
    typical_provision: "Employee shall serve as [Job Title] and report directly to [Supervisor Title], performing duties standard for such role."
    risk_level: "MEDIUM"

  - title: "Benefits, Health Coverage, and Paid Time Off"
    category: "Employment"
    why_it_matters: "Outlines leave entitlements (sick leave, vacation, parental leave) and insurance benefits."
    potential_risk: "Omission leaves leave balances, insurance contributions, and PTO accrual uncommitted and unenforceable."
    typical_provision: "Employee is eligible for standard health benefits and 20 days of paid vacation per calendar year."
    risk_level: "MEDIUM"

  - title: "Confidentiality and Trade Secrets"
    category: "Privacy"
    why_it_matters: "Protects proprietary business secrets, customer lists, and non-public technical data."
    potential_risk: "Without a confidentiality clause, an employer cannot easily prevent trade secret misappropriation."
    typical_provision: "Employee agrees to hold all proprietary trade secrets in strict confidence during and after employment."
    risk_level: "MEDIUM"

  - title: "Governing Law and Dispute Resolution"
    category: "Legal"
    why_it_matters: "Determines which jurisdiction's employment laws apply and whether arbitration or court litigation governs."
    potential_risk: "Absence creates jurisdictional ambiguity and unpredictable litigation costs in remote venues."
    typical_provision: "This Agreement is governed by the laws of [Jurisdiction], with disputes settled in competent local courts."
    risk_level: "LOW"

rental_lease:
  - title: "Security Deposit Handling and Return Timeline"
    category: "Financial"
    why_it_matters: "Governs the deposit amount, allowable deduction criteria, and statutory refund deadline following tenancy."
    potential_risk: "Tenants risk wrongful forfeiture or multi-month delays in recovering their rental deposits."
    typical_provision: "Landlord shall return the security deposit within 30 days of lease expiration, less documented repair deductions."
    risk_level: "HIGH"

  - title: "Maintenance Obligations and Habitability Standards"
    category: "Liability"
    why_it_matters: "Allocates repair duties for structural, plumbing, heating, and common areas between landlord and tenant."
    potential_risk: "Tenants may be saddled with major structural repair costs or forced to live in unhabitable conditions."
    typical_provision: "Landlord shall maintain the roof, foundation, plumbing, and heating systems in good working condition."
    risk_level: "HIGH"

  - title: "Right of Entry and Advance Notice"
    category: "Privacy"
    why_it_matters: "Protects tenant quiet enjoyment and requires advance notice before landlord inspections."
    potential_risk: "Landlords could enter the premises unannounced at will, violating privacy and quiet enjoyment."
    typical_provision: "Landlord may enter the premises only upon at least 24 hours prior written notice, except in emergencies."
    risk_level: "MEDIUM"

  - title: "Rent Increase Limitations and Renewal Terms"
    category: "Financial"
    why_it_matters: "Defines notice periods for rent increases and options for lease term renewal."
    potential_risk: "Tenants can face arbitrary price gouging upon lease expiration or unexpected eviction."
    typical_provision: "Any rent adjustments upon renewal require at least 60 days advance written notice."
    risk_level: "MEDIUM"

  - title: "Utilities and Incidental Service Allocation"
    category: "Financial"
    why_it_matters: "Explicitly delineates which party pays for water, gas, electricity, trash, and internet."
    potential_risk: "Unclear utility terms trigger recurring monthly billing disputes and service shutoffs."
    typical_provision: "Tenant pays electric and gas; Landlord provides water, sewer, and municipal trash collection."
    risk_level: "LOW"

  - title: "Governing Law and Eviction Procedure"
    category: "Legal"
    why_it_matters: "Specifies governing state tenancy codes and lawful notice requirements before formal eviction."
    potential_risk: "Unclear procedural rules create legal vulnerability during lease defaults."
    typical_provision: "Governed by the residential tenancy statutes of [State/Municipality]."
    risk_level: "LOW"

nda:
  - title: "Specific Exclusions from Confidential Information"
    category: "Legal"
    why_it_matters: "Exempts public knowledge, pre-existing knowledge, independent developments, and lawful third-party disclosures."
    potential_risk: "Without standard carve-outs, receiving party is restricted from using even public industry knowledge."
    typical_provision: "Confidential Information does not include info already public, independently developed, or lawfully received."
    risk_level: "HIGH"

  - title: "Compulsory Legal Process / Subpoena Carve-Out"
    category: "Legal"
    why_it_matters: "Permits disclosure when mandated by court subpoena or law enforcement directive without breach."
    potential_risk: "Receiving party faces conflict between court contempt orders and NDA breach liabilities."
    typical_provision: "Disclosure is permitted pursuant to valid court order, provided disclosing party receives prompt notice."
    risk_level: "HIGH"

  - title: "Duration of Confidentiality Obligation"
    category: "Contractual"
    why_it_matters: "Sets a reasonable expiration timeframe (e.g., 2, 3, or 5 years) rather than perpetual indefinite lock-in."
    potential_risk: "Indefinite covenants can impair future employment or commercial ventures and face unenforceability."
    typical_provision: "Obligations under this Agreement remain in effect for a period of 3 years following disclosure."
    risk_level: "MEDIUM"

  - title: "Return or Destruction of Disclosed Materials"
    category: "Privacy"
    why_it_matters: "Requires returning or certifying destruction of confidential copies upon agreement termination."
    potential_risk: "Old sensitive files remain lingering in external environments indefinitely."
    typical_provision: "Upon written request, recipient shall promptly return or certify destruction of all confidential materials."
    risk_level: "MEDIUM"

  - title: "No License or IP Transfer Disclaimer"
    category: "Contractual"
    why_it_matters: "Clarifies that sharing confidential materials grants no patent, trademark, or copyright licenses."
    potential_risk: "Disclosing party risks implied license claims over proprietary assets."
    typical_provision: "No license or conveyance of intellectual property rights is granted or implied herein."
    risk_level: "LOW"

service_agreement:
  - title: "Payment Terms and Invoicing Schedule"
    category: "Financial"
    why_it_matters: "Specifies fee structure, milestone payments, invoicing deadlines (e.g. Net 30), and late payment interest."
    potential_risk: "Unclear payment timelines lead to cash flow disruptions and payment disputes."
    typical_provision: "Client shall pay all undisputed invoices within thirty (30) days of receipt."
    risk_level: "HIGH"

  - title: "Detailed Scope of Work (SOW) and Acceptance Criteria"
    category: "Contractual"
    why_it_matters: "Precisely details milestones, deliverables, specifications, and formal acceptance testing."
    potential_risk: "Scope creep, endless revisions, and withheld milestone payments due to undefined sign-off terms."
    typical_provision: "Deliverables are deemed accepted if no written defect notice is delivered within 10 business days."
    risk_level: "HIGH"

  - title: "Limitation of Liability and Consequential Damages Waiver"
    category: "Liability"
    why_it_matters: "Caps liability at fees paid and waives speculative lost profits or indirect damages."
    potential_risk: "A minor service glitch could expose service provider to catastrophic uncapped liability."
    typical_provision: "Neither party shall be liable for indirect, incidental, or lost profit damages exceeding fees paid."
    risk_level: "HIGH"

  - title: "Intellectual Property Ownership and Client Deliverable Assignment"
    category: "Legal"
    why_it_matters: "Clarifies whether client owns the final deliverables and provider retains pre-existing tools/frameworks."
    potential_risk: "Client may pay for development but not actually own the resulting software or IP."
    typical_provision: "Client owns Deliverables upon full payment; Vendor retains ownership of pre-existing background tools."
    risk_level: "HIGH"

  - title: "Termination for Convenience and Kill Fees"
    category: "Financial"
    why_it_matters: "Permits cancellation on advance notice with payment for work performed up to termination."
    potential_risk: "Parties remain trapped in unproductive vendor relationships without clear exit paths."
    typical_provision: "Client may terminate for convenience on 30 days notice upon paying for completed work."
    risk_level: "MEDIUM"

  - title: "Force Majeure and Uncontrollable Delays"
    category: "Contractual"
    why_it_matters: "Excuses delivery delays caused by natural disasters, strikes, or government lockdowns."
    potential_risk: "Service provider is subjected to breach damages for delays outside their reasonable control."
    typical_provision: "Neither party is liable for performance delays caused by events beyond reasonable control."
    risk_level: "LOW"

sale:
  - title: "Warranties and Disclaimer of Implied Warranties"
    category: "Liability"
    why_it_matters: "Specifies product quality warranties (or 'as-is' status) and disclaims merchantability."
    potential_risk: "Seller faces unexpected implied warranty claims; Buyer receives defective goods with zero recourse."
    typical_provision: "Goods are sold with standard 1-year express warranty; all implied warranties are disclaimed."
    risk_level: "HIGH"

  - title: "Risk of Loss and Transfer of Title"
    category: "Contractual"
    why_it_matters: "Identifies the exact shipping point (e.g. FOB Destination) where damage risk shifts to buyer."
    potential_risk: "Disputes over who pays when goods are destroyed or lost in transit."
    typical_provision: "Title and risk of loss pass to Buyer upon delivery to common carrier at Seller facility."
    risk_level: "HIGH"

  - title: "Inspection, Rejection, and Return Rights"
    category: "Contractual"
    why_it_matters: "Provides a defined window for buyer to inspect goods and reject non-conforming items."
    potential_risk: "Buyer is deemed to have accepted defective goods without adequate testing opportunity."
    typical_provision: "Buyer has 7 days from delivery to inspect and report non-conforming goods for replacement."
    risk_level: "MEDIUM"

  - title: "Payment Terms and Late Interest"
    category: "Financial"
    why_it_matters: "States invoice due dates (e.g., Net 30) and interest rates on overdue accounts."
    potential_risk: "Cash flow interruptions and unrecoverable collection costs on delinquent balances."
    typical_provision: "Payment is due Net 30 days from invoice; overdue balances accrue 1.5% monthly interest."
    risk_level: "MEDIUM"

loan:
  - title: "Interest Rate Calculation and Compounding Terms"
    category: "Financial"
    why_it_matters: "States fixed vs variable rates, APR, compounding frequency, and margin indices."
    potential_risk: "Borrower may face hidden compounding fees or sudden variable rate spikes."
    typical_provision: "Principal bears fixed interest at [Rate]% per annum, computed on an actual/360 day basis."
    risk_level: "HIGH"

  - title: "Events of Default and Acceleration Clause"
    category: "Financial"
    why_it_matters: "Defines missed payment thresholds that trigger immediate demand for full loan balance."
    potential_risk: "A single missed notice can accelerate the entire principal balance into immediate collections."
    typical_provision: "Upon an uncured Event of Default, Lender may declare the entire outstanding balance due immediately."
    risk_level: "HIGH"

  - title: "Prepayment Rights and Penalty Waivers"
    category: "Financial"
    why_it_matters: "Clarifies whether borrower can pay down principal early without paying hefty penalty fees."
    potential_risk: "Borrower is locked into high interest and penalized for refinancing or early payoff."
    typical_provision: "Borrower may prepay the principal in whole or in part at any time without penalty or premium."
    risk_level: "MEDIUM"

  - title: "Collateral Description and Security Interest"
    category: "Legal"
    why_it_matters: "Specifies pledged assets (real estate, receivables, equipment) backing the loan obligation."
    potential_risk: "Unclear collateral definitions jeopardize lender priority or risk over-pledging borrower assets."
    typical_provision: "This Note is secured by a first-priority security interest in the assets specified in Exhibit A."
    risk_level: "HIGH"

other:
  - title: "Term and Termination Provisions"
    category: "Contractual"
    why_it_matters: "Clarifies how long the agreement lasts and how either party can cancel or exit."
    potential_risk: "Parties remain trapped in an indefinite binding commitment without an exit mechanism."
    typical_provision: "This agreement is effective for 1 year and may be cancelled on 30 days written notice."
    risk_level: "HIGH"

  - title: "Limitation of Liability"
    category: "Liability"
    why_it_matters: "Caps exposure to foreseeable commercial losses rather than unlimited enterprise damages."
    potential_risk: "Uncapped liability exposes parties to existential financial claims from minor contract breaches."
    typical_provision: "Each party's total liability under this agreement shall be capped at fees paid hereunder."
    risk_level: "HIGH"

  - title: "Governing Law and Forum Selection"
    category: "Legal"
    why_it_matters: "Specifies which state/country laws govern and where lawsuits must be filed."
    potential_risk: "Uncertainty regarding legal jurisdiction causes protracted procedural jurisdictional fights."
    typical_provision: "This Agreement shall be governed by and construed in accordance with the laws of [State]."
    risk_level: "MEDIUM"

  - title: "Severability and Entire Agreement"
    category: "Legal"
    why_it_matters: "Ensures remaining clauses survive if one clause is invalidated, and supersedes oral promises."
    potential_risk: "A single defective clause can collapse the entire contract; prior verbal promises cause disputes."
    typical_provision: "If any provision is held invalid, the remainder continues in full force and effect."
    risk_level: "LOW"

