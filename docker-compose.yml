services:
  mysql:
    image: mysql:8.0
    container_name: lexilegal-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-storage-engine=InnoDB
      --max_connections=200
      --innodb_file_per_table=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lexilegal}
      MYSQL_USER: ${MYSQL_USER:-lexilegal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lexilegal}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - lexilegal_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  lexilegal_mysqldata:
    name: lexilegal_mysqldata
